# Configuración del proyecto Supabase para la CLI (npx supabase ...).
# El project_id se completa con: npx supabase link --project-ref <ref>

[db]
major_version = 17

[db.migrations]
enabled = true

[auth]
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173", "https://proyvia.livaque.app"]
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
# Límites anti-abuso (punto 7: rate limiting del lado de Auth)
max_frequency = "1m0s"

[auth.rate_limit]
email_sent = 10
sign_in_sign_ups = 30
token_refresh = 150
token_verifications = 30
